<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--background);
    color: var(--foreground);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Geist", system-ui, sans-serif;
    user-select: none;
  }
  .bar {
    position: absolute; inset: 0 0 auto 0; height: 36px; box-sizing: border-box;
    display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border-bottom: 1px solid var(--border); background: var(--background);
  }
  .title { font-weight: 600; white-space: nowrap; }
  .count { color: var(--muted-foreground); font-weight: 400; margin-left: 4px; }
  select, button {
    font: inherit; color: var(--foreground); background: var(--secondary, var(--muted));
    border: 1px solid var(--border); border-radius: 6px; height: 24px; padding: 0 8px;
  }
  select { flex: 1 1 auto; min-width: 0; max-width: 140px; margin-left: auto; }
  .icon { width: 24px; padding: 0; flex: none; font-size: 14px; line-height: 1; }
  button { cursor: pointer; transition: background-color .15s ease; }
  button:hover, select:hover { background: var(--accent); }
  .info { color: var(--muted-foreground); font-size: 12px; }
  .icon svg { width: 14px; height: 14px; display: block; margin: auto; }
  /* sky forced to a fixed time: framed, so it's clear it isn't following the clock */
  .icon.forced { border-color: var(--muted-foreground); }
  #c { position: absolute; inset: 36px 0 0 0; width: 100%; height: calc(100% - 36px); display: block; image-rendering: pixelated; cursor: default; touch-action: none; }
</style>

<div class="bar">
  <span class="title">Pokémon<span class="count" id="count"></span></span>
  <select id="pick" aria-label="Choose a Pokémon"></select>
  <button id="add" class="icon" title="Add the selected Pokémon" aria-label="Add">+</button>
  <button id="reset" class="icon" title="Restore the starting party" aria-label="Reset">↺</button>
  <button id="sky" class="icon" aria-label="Sky"></button>
  <button class="icon info" title="Click a Pokémon to say hi; press and rub to pet it. At night they sleep.&#10;Pick a berry from the tree (click or drag it), then bring it to a Pokémon to feed it.&#10;Every so often whoever is on the field gets to work with its own kit: a little PC (coding), the Pokédex (research), a Pokémon Center machine (tests), an anvil (build), a letter (deploy).&#10;Sky button: follow the clock, or force day / dusk / night.&#10;Sprites: PMD Sprite Repository (SpriteCollab), CC BY-NC 4.0." aria-label="Info">ⓘ</button>
</div>
<canvas id="c"></canvas>

<script>
'use strict'
const DATA = /*__SPRITES__*/null

const SCALE = 2 // pixel-art scale in CSS px
const MAX_PETS = 10
const FPS = 30
const ROW = { down: 0, downRight: 1, right: 2, upRight: 3, up: 4, upLeft: 5, left: 6, downLeft: 7 }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches

const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
const mons = {}
let pets = []
let W = 0, H = 0, groundTop = 0, dpr = 1
let bg = null, bgPhase = ''
let prevBg = null, fadeStart = 0 // previous sky, crossfaded out after a phase change
const SKY_FADE_MS = 700

const rand = (a, b) => a + Math.random() * (b - a)
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)]
const css = (name, fallback) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback
let TOK = {}
function readTokens () {
  TOK = {
    muted: css('--muted-foreground', '#a1a1aa'),
    popover: css('--popover', '#18181b'),
    popoverFg: css('--popover-foreground', '#fafafa'),
    border: css('--border', '#3f3f46')
  }
}

function loadImage (src) {
  return new Promise((resolve, reject) => {
    const img = new Image()
    img.onload = () => resolve(img)
    img.onerror = reject
    img.src = src
  })
}

// pixels of the first frame of a row, for measuring where the sprite actually sits in its frame
function framePixels (anim, row) {
  const oc = document.createElement('canvas')
  oc.width = anim.fw
  oc.height = anim.fh
  const o = oc.getContext('2d')
  o.drawImage(anim.img, 0, Math.min(row, anim.rows - 1) * anim.fh, anim.fw, anim.fh, 0, 0, anim.fw, anim.fh)
  return o.getImageData(0, 0, anim.fw, anim.fh).data
}

// Distance from the frame centre to the lowest opaque pixel: PMD frames share one centre
// across animations, so this puts every animation's feet on the same ground line.
function feetOffset (anim) {
  try {
    const d = framePixels(anim, ROW.right)
    for (let y = anim.fh - 1; y >= 0; y--) {
      for (let x = 0; x < anim.fw; x++) if (d[(y * anim.fw + x) * 4 + 3] > 0) return y + 1 - anim.fh / 2
    }
  } catch (_) {}
  return anim.fh / 2 - 4
}

// ...and up to the top of the head when facing front: where a petting hand lands
function headOffset (anim) {
  try {
    const d = framePixels(anim, ROW.down)
    for (let y = 0; y < anim.fh; y++) {
      for (let x = 0; x < anim.fw; x++) if (d[(y * anim.fw + x) * 4 + 3] > 0) return y - anim.fh / 2
    }
  } catch (_) {}
  return -anim.fh / 4
}

function frameAt (anim, ms) {
  let tick = (ms * 60 / 1000) % anim.total
  for (let i = 0; i < anim.dur.length; i++) {
    if (tick < anim.dur[i]) return i
    tick -= anim.dur[i]
  }
  return 0
}

// Sky: follows the clock ('auto') or is forced to a time of day by the sky
// button. Not persisted — panels can't use storage — so it opens on 'auto'.
const SKY_MODES = ['auto', 'day', 'dusk', 'night']
const SKY_LABEL = { auto: 'Sky: auto (follows the clock)', day: 'Sky: day', dusk: 'Sky: dusk', night: 'Sky: night' }
const SKY_ICON = {
  auto: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="currentColor" stroke="none"/></svg>',
  day: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>',
  dusk: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1.5 12h13M4.8 12a3.2 3.2 0 0 1 6.4 0M8 4.5v1.5M3.3 6.6l1 1M12.7 6.6l-1 1"/></svg>',
  night: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M13.2 10.2A5.6 5.6 0 0 1 5.8 2.8a5.6 5.6 0 1 0 7.4 7.4z"/></svg>'
}
let skyMode = 'auto'

function clockPhase () {
  const h = new Date().getHours()
  if (h >= 21 || h < 5) return 'night'
  if (h >= 17 || h < 7) return 'dusk'
  return 'day'
}

function phaseNow () {
  return skyMode === 'auto' ? clockPhase() : skyMode
}

// Pokémon react to a forced change right away: nightfall makes them drowsy
// soon, daylight wakes the sleepers (Snorlax keeps napping).
function applySky () {
  const night = phaseNow() === 'night'
  for (const p of pets) {
    if (night && p.state !== 'sleep') p.until = Math.min(p.until, p.t + rand(300, 2500))
    else if (!night && p.state === 'sleep' && p.mon.key !== 'snorlax') p.setState(Math.random() < 0.5 ? 'idle' : 'walk')
  }
}

function renderSkyButton () {
  const btn = document.getElementById('sky')
  btn.innerHTML = SKY_ICON[skyMode]
  btn.title = `${SKY_LABEL[skyMode]} — click to change`
  btn.setAttribute('aria-label', SKY_LABEL[skyMode])
  btn.classList.toggle('forced', skyMode !== 'auto')
}

class Pet {
  constructor (mon, x, y) {
    this.mon = mon
    this.x = x
    this.y = y
    this.dir = Math.random() < 0.5 ? -1 : 1
    this.vx = 0
    this.vy = 0
    this.bubble = 0
    this.say = '' // bubble text; empty shows the Pokémon's name
    this.job = null // see "work" below
    this.snack = null // a berry it's eating, see "berry tree" below
    this.setState(reduceMotion ? 'idle' : pick(['walk', 'idle']))
  }

  setState (state) {
    this.state = state
    this.t = 0
    this.facingFront = state === 'idle' && Math.random() < 0.35
    const night = phaseNow() === 'night'
    if (state === 'goto') {
      this.until = 15000 // give up if the spot is somehow unreachable
    } else if (state === 'work') {
      this.vx = this.vy = 0
      this.until = rand(...this.job.dur)
    } else if (state === 'walk') {
      const speed = rand(18, 34)
      this.dir = Math.random() < 0.7 ? this.dir : -this.dir
      this.vx = this.dir * speed
      this.vy = Math.random() < 0.35 ? rand(-12, 12) : 0
      this.until = rand(2500, 6500)
    } else if (state === 'sleep') {
      this.vx = this.vy = 0
      this.until = night ? rand(40000, 120000) : rand(8000, 20000)
    } else if (state === 'hop') {
      this.vx = this.vy = 0
      const hop = this.mon.anims.hop
      this.until = hop ? (hop.total * 1000 / 60) * 2 : 600
    } else {
      this.vx = this.vy = 0
      this.until = rand(1800, 5000)
    }
  }

  next () {
    if (this.job) return this.state === 'work' ? finishJob(this) : dropJob(this)
    if (reduceMotion) return this.setState('idle')
    const night = phaseNow() === 'night'
    const sleepy = this.mon.key === 'snorlax' ? 0.5 : night ? 0.6 : 0.08
    if (this.state === 'walk') return this.setState(Math.random() < 0.7 ? 'idle' : 'walk')
    const r = Math.random()
    if (r < sleepy) return this.setState('sleep')
    this.setState(r < sleepy + 0.65 ? 'walk' : 'idle')
  }

  update (dt) {
    if (this.bubble > 0) this.bubble -= dt
    else this.say = ''
    if (this.snack) return updateSnack(this, dt)
    if (isPetted(this)) return // holds still while being petted; a job just waits
    this.t += dt
    if (this.state === 'goto') {
      const spot = this.job.spot
      const dx = spot.x - this.x, dy = spot.y - this.y, d = Math.hypot(dx, dy)
      if (d < 2) {
        this.x = spot.x
        this.y = spot.y
        startWork(this)
      } else {
        const k = Math.min(1, (44 * dt / 1000) / d)
        this.x += dx * k
        this.y += dy * k
        this.vx = dx
        this.vy = dy
        this.dir = dx >= 0 ? 1 : -1
      }
    }
    if (this.state === 'walk') {
      this.x += this.vx * dt / 1000
      this.y += this.vy * dt / 1000
      const margin = 24
      if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx); this.dir = 1 }
      if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx); this.dir = -1 }
      const top = groundTop + 30, bottom = H - 12
      if (this.y < top) { this.y = top; this.vy = Math.abs(this.vy) }
      if (this.y > bottom) { this.y = bottom; this.vy = -Math.abs(this.vy) }
    }
    if (this.t > this.until) this.next()
  }

  anim () {
    const a = this.mon.anims
    if (this.snack) return a.eat || a.idle
    if ((this.state === 'walk' || this.state === 'goto') && !isPetted(this)) return a.walk
    if (this.state === 'sleep') return a.sleep || a.idle
    if (this.state === 'hop') return a.hop || a.idle
    return a.idle // workers stay in their idle pose facing the kit; the kit shows the action
  }

  row (anim) {
    let row
    const moving = this.state === 'walk' || this.state === 'goto'
    if (this.snack) {
      row = ROW.down // eats facing you
    } else if (moving && Math.abs(this.vy) > Math.abs(this.vx) * 0.6) {
      row = this.vy > 0 ? (this.dir > 0 ? ROW.downRight : ROW.downLeft) : (this.dir > 0 ? ROW.upRight : ROW.upLeft)
    } else if (this.state === 'hop' || (this.state === 'idle' && this.facingFront)) {
      row = ROW.down
    } else {
      row = this.dir > 0 ? ROW.right : ROW.left
    }
    return Math.min(row, anim.rows - 1)
  }

  rect () {
    const a = this.mon.anims.walk
    const cy = this.y - this.mon.feet * SCALE
    return { x: this.x - (a.fw / 2) * SCALE, y: cy - (a.fh / 2) * SCALE, w: a.fw * SCALE, h: a.fh * SCALE }
  }

  draw (now) {
    const anim = this.anim()
    const frame = reduceMotion ? 0 : frameAt(anim, this.snack ? this.snack.t : this.state === 'hop' ? this.t : now + this.mon.phase)
    const row = this.row(anim)
    // small motions: a 1px bob while typing (or chewing, without an eating sheet), a lean into each hammer blow
    let bob = 0, lean = 0
    if (this.snack) {
      if (!this.mon.anims.eat) bob = Math.floor(this.snack.t / 160) % 2
    } else if (this.state === 'work') {
      if (this.job.type === 'dev') bob = Math.floor(now / 170) % 2
      else if (this.job.type === 'build' && now - (this.lastSpark || 0) < 140) lean = this.dir * 3
    }
    const cy = this.y - this.mon.feet * SCALE - bob
    // under a petting hand: squashed from the feet up, so they stay planted
    const sq = squashOf(this), sx = 1 + sq * 0.1, sy = 1 - sq * 0.14
    // ground shadow, ringed while a carried berry hovers over it
    const rx = 9 * SCALE * this.mon.shadow, ry = 3 * SCALE
    ctx.fillStyle = 'rgba(0,0,0,0.22)'
    ctx.beginPath()
    ctx.ellipse(this.x, this.y - 1, rx, ry, 0, 0, Math.PI * 2)
    ctx.fill()
    if (this === aim) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'
      ctx.lineWidth = 1.5
      ctx.beginPath()
      ctx.ellipse(this.x, this.y - 1, rx + 4, ry + 2, 0, 0, Math.PI * 2)
      ctx.stroke()
    }
    ctx.drawImage(
      anim.img, frame * anim.fw, row * anim.fh, anim.fw, anim.fh,
      Math.round(this.x + lean - (anim.fw / 2) * SCALE * sx), Math.round(this.y - bob - (anim.fh / 2 + this.mon.feet) * SCALE * sy),
      Math.round(anim.fw * SCALE * sx), Math.round(anim.fh * SCALE * sy)
    )
    if (this.state === 'sleep') drawZzz(this.x + 10, this.rect().y + 8, now)
    if (this.snack) drawSnack(this)
    if (this.job) drawJobProps(this, now)
    if (this.bubble > 0) drawBubble(this.say || this.mon.name, this.x, Math.min(this.rect().y, cy - (anim.fh / 2) * SCALE + 6) - 4)
  }
}

function drawZzz (x, y, now) {
  const t = (now / 900) % 3
  ctx.fillStyle = TOK.muted
  ctx.font = '600 10px -apple-system, system-ui, sans-serif'
  for (let i = 0; i < 3; i++) {
    const k = (t + i) % 3
    ctx.globalAlpha = Math.max(0, 1 - k / 3)
    ctx.fillText('z', x + k * 5, y - k * 7)
  }
  ctx.globalAlpha = 1
}

function drawBubble (text, x, y) {
  ctx.font = '600 11px -apple-system, system-ui, sans-serif'
  const w = ctx.measureText(text).width + 14, h = 20
  const bx = Math.max(4, Math.min(W - w - 4, x - w / 2)), by = Math.max(4, y - h)
  ctx.fillStyle = TOK.popover
  ctx.strokeStyle = TOK.border
  ctx.beginPath()
  ctx.roundRect(bx, by, w, h, 8)
  ctx.fill()
  ctx.stroke()
  ctx.fillStyle = TOK.popoverFg
  ctx.fillText(text, bx + 7, by + 14)
}

// ---------- work: each Pokémon carries its own kit ----------
// Every so often a free Pokémon — whoever happens to be on the field — takes a job: it
// trots to an open spot, pulls out its kit with a puff, works, then puts it away. Just for
// fun: Orca's plugin API gives panels no view of what the coding agent is actually doing.
const JOBS = {
  dev:    { weight: 30, dur: [9000, 15000], label: 'coding',      done: ['Committed!', 'Code done!'] },
  scan:   { weight: 22, dur: [4200, 6500],  label: 'researching', done: null }, // "Data: <subject>"
  test:   { weight: 18, dur: [6000, 8000],  label: 'testing',     done: ['Tests passed ✓', 'All green ✓'] },
  build:  { weight: 16, dur: [5500, 8500],  label: 'building',    done: ['Build done!', 'Built!'] },
  deploy: { weight: 14, dur: [1300, 1700],  label: 'deploying',   done: ['Shipped!', 'Deployed!'] }
}
// the team loosely follows a release: whoever finishes a stage hands off to the next one
const PIPELINE = ['dev', 'test', 'build', 'deploy']
let nextStage = 'dev'
let effects = []
let nextJobAt = performance.now() + rand(3000, 6000)
const lerp = (a, b, k) => a + (b - a) * k
const easeOut = (k) => 1 - (1 - k) * (1 - k)

function weightedPick (items, weight) {
  let r = Math.random() * items.reduce((sum, it) => sum + weight(it), 0)
  for (const it of items) if ((r -= weight(it)) <= 0) return it
  return items[items.length - 1]
}

function director (now) {
  if (reduceMotion || now < nextJobAt || !pets.length) return
  const night = phaseNow() === 'night'
  nextJobAt = now + (night ? rand(25000, 50000) : rand(5000, 11000))
  const busy = pets.filter((p) => p.job)
  const cap = night ? 1 : Math.min(3, Math.ceil(pets.length / 2))
  if (busy.length >= cap) return
  const free = pets.filter((p) => !p.job && !p.snack && !isPetted(p) && (p.state === 'idle' || p.state === 'walk'))
  if (!free.length) return
  // any Pokémon can take any job — Snorlax would just rather nap
  const pet = weightedPick(free, (p) => (p.mon.key === 'snorlax' ? 0.4 : 1))
  const taken = new Set(busy.map((p) => p.job.type))
  assignJob(pet, weightedPick(Object.keys(JOBS), (type) =>
    JOBS[type].weight * (type === nextStage ? 3 : 1) * (taken.has(type) ? 0.3 : 1)))
}

// an open patch of grass near the Pokémon, away from the others, with room for the kit
function openSpot (pet) {
  let best = { x: pet.x, y: pet.y }, bestRoom = -1
  for (let i = 0; i < 14; i++) {
    const x = Math.min(Math.max(pet.x + rand(-130, 130), 56), W - 56)
    const y = Math.min(Math.max(pet.y + rand(-70, 70), groundTop + 34), H - 16)
    let room = 999
    for (const p of pets) {
      if (p === pet) continue
      room = Math.min(room, Math.hypot(p.x - x, (p.y - y) * 1.6))
      // keep clear of where other workers are heading too, kits included
      if (p.job) room = Math.min(room, Math.hypot(p.job.spot.x - x, (p.job.spot.y - y) * 1.6) - 30)
    }
    if (room > bestRoom) { bestRoom = room; best = { x, y } }
  }
  return best
}

function assignJob (pet, type) {
  const job = { type, ...JOBS[type] }
  if (type === 'scan') {
    // research: study another Pokémon on the field with the Pokédex (the grass, if alone)
    const others = pets.filter((p) => p !== pet)
    job.target = others.length ? pick(others) : null
    job.spot = { x: pet.x, y: pet.y }
  } else {
    job.spot = openSpot(pet)
  }
  pet.job = job
  pet.setState('goto')
}

// where the kit stands: on the grass in front of the Pokémon
function kitAt (pet) {
  return { x: pet.x + pet.dir * (pet.rect().w * 0.26 + 14), y: pet.y }
}

function puff (x, y) {
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2
    effects.push({ kind: 'puff', x, y, vx: Math.cos(a) * 34, vy: Math.sin(a) * 18 - 10, t: 0, life: 380 })
  }
}

function startWork (pet) {
  const job = pet.job
  pet.setState('work')
  if (job.type === 'scan') {
    if (job.target) pet.dir = job.target.x >= pet.x ? 1 : -1
  } else {
    // face the side with room for the kit
    pet.dir = pet.x > W - 64 ? -1 : pet.x < 64 ? 1 : pick([-1, 1])
    if (job.type !== 'deploy') { const k = kitAt(pet); puff(k.x, k.y - 8) }
  }
}

function finishJob (pet) {
  const job = pet.job
  const stage = PIPELINE.indexOf(job.type)
  if (stage >= 0) nextStage = PIPELINE[(stage + 1) % PIPELINE.length]
  if (job.type === 'deploy') {
    // the release flies off
    effects.push({ kind: 'letter', x: pet.x, y: pet.y - pet.mon.feet * SCALE - 30, vx: pet.dir * rand(10, 22), vy: -80, t: 0, life: 1800 })
  } else if (job.type !== 'scan') {
    const k = kitAt(pet)
    puff(k.x, k.y - 8)
  }
  const subject = job.target && pets.includes(job.target) ? job.target.mon.name : 'grass'
  pet.job = null
  pet.say = job.done ? pick(job.done) : `Data: ${subject}`
  pet.bubble = 2200
  pet.setState(reduceMotion ? 'idle' : 'hop')
}

function dropJob (pet) {
  pet.job = null
  pet.setState('idle')
}

function updateWork (now, dt) {
  for (const p of pets) {
    // hammer sparks while building
    if (p.state === 'work' && p.job.type === 'build' && now - (p.lastSpark || 0) > 430) {
      p.lastSpark = now
      const k = kitAt(p)
      for (let i = 0; i < 4; i++) {
        effects.push({
          kind: 'spark', x: k.x, y: k.y - 12, vx: rand(-40, 40), vy: rand(-70, -30),
          g: 160, t: 0, life: rand(250, 450), color: pick(['#ffd33d', '#ffe9a0', '#ff9f43'])
        })
      }
    }
  }
  for (const e of effects) {
    e.t += dt
    e.x += e.vx * dt / 1000
    e.y += e.vy * dt / 1000
    e.vy += (e.g || 0) * dt / 1000
  }
  effects = effects.filter((e) => e.t < e.life)
}

// pixel-art painter: (x, y, w, h) in art pixels from an origin, `s` screen px each
function painter (ox, oy, s = SCALE) {
  return (x, y, w, h, color) => {
    ctx.fillStyle = color
    ctx.fillRect(Math.round(ox + x * s), Math.round(oy + y * s), Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s)))
  }
}
const INK = '#2b2b35'

// pixel map: one string per row, one palette key per art pixel ('.' = clear)
function drawMap (p, map, pal) {
  map.forEach((line, y) => {
    for (let x = 0; x < line.length; x++) if (pal[line[x]]) p(x, y, 1, 1, pal[line[x]])
  })
}

function drawLetter (x, y) {
  const p = painter(x, y)
  p(0, 0, 6, 4, INK); p(1, 1, 4, 2, '#f8f3e6'); p(2, 1, 2, 1, '#d64545')
}

// portable kits, drawn bottom-centre on the grass. k = job progress 0..1
const KITS = {
  // a little PC: code scrolls on the screen while the keys tap away
  dev: { w: 14, h: 12, draw (p, k, now) {
    p(1, 0, 12, 8, INK); p(2, 1, 10, 6, '#c8c8d0'); p(3, 2, 8, 4, '#12301f'); p(5, 8, 4, 1, INK)
    p(0, 10, 14, 2, INK); p(1, 10, 12, 1, '#d8d8e0')
    const step = Math.floor(now / 220)
    for (let i = 0; i < 4; i++) {
      const n = step + i, indent = n % 3
      p(3.5 + indent, 2.5 + i * 0.85, Math.min(1.5 + ((n * 7) % 6), 7 - indent), 0.5, ['#7ee787', '#f2cc60', '#79c0ff', '#ff7b72'][n % 4])
    }
  } },
  // a pocket Pokémon Center machine: the balls light up one by one, all green = pass
  test: { w: 12, h: 10, draw (p, k, now) {
    p(0, 0, 12, 4, INK); p(1, 1, 10, 2, '#cfc8b8')
    const lit = Math.floor(k * 5)
    for (let i = 0; i < 4; i++) {
      const pass = lit >= 4, on = i < lit
      p(1 + i * 2.75, 1, 2, 1, pass ? '#56d364' : on ? '#ffd33d' : '#d64545')
      p(1 + i * 2.75, 2, 2, 1, pass ? '#c9f5d0' : on ? '#fff3b0' : '#f3efe6')
    }
    p(0, 4, 12, 6, INK); p(1, 5, 10, 4, '#f3efe6'); p(1, 7, 10, 1, '#e86a83')
    p(4, 5.5, 4, 1, Math.floor(now / 250) % 2 ? '#56d364' : '#2f7d3a')
  } },
  // an anvil: the halves of a Poké Ball close up as the build hammers on
  build: { w: 12, h: 11, draw (p, k) {
    p(0, 7, 12, 2, INK); p(1, 7, 10, 1, '#8b8b96'); p(3, 9, 6, 1, '#5d5d6b'); p(2, 10, 8, 1, '#4a4a55')
    const gap = Math.round((1 - k) * 3)
    p(3.5, 5, 5, 1, '#f3efe6'); p(4.5, 6, 3, 1, '#f3efe6')
    p(4.5, 3 - gap, 3, 1, '#d64545'); p(3.5, 4 - gap, 5, 1, '#d64545')
    if (!gap) { p(3.5, 5, 5, 0.5, INK); p(5.5, 5, 1, 1, '#f3efe6') }
  } }
}

// what a worker holds: its kit on the grass, the Pokédex, or the release letter overhead
function drawJobProps (pet, now) {
  const job = pet.job
  const head = pet.y - pet.mon.feet * SCALE - 30
  if (job.type === 'deploy') {
    const lift = pet.state === 'work' ? Math.sin(Math.min(1, pet.t / 300) * Math.PI / 2) * 6 + Math.sin(now / 90) : 0
    drawLetter(pet.x - 6, head - lift)
    return
  }
  if (pet.state !== 'work') return
  if (job.type === 'scan') {
    const cx = pet.x + pet.dir * 18, cy = pet.y - pet.mon.feet * SCALE - 4
    const subject = job.target && pets.includes(job.target) ? job.target : null
    const tx = subject ? subject.x : cx + pet.dir * 50
    const ty = subject ? subject.y - subject.mon.feet * SCALE : pet.y
    const sweep = Math.sin(now / 260) * 8
    ctx.fillStyle = 'rgba(120,220,255,0.16)'
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty - 12 + sweep); ctx.lineTo(tx, ty + 12 + sweep); ctx.closePath(); ctx.fill()
    const p = painter(cx - 3.5 * SCALE, cy - 3 * SCALE)
    p(0, 0, 7, 6, INK); p(1, 1, 5, 4, '#d63c3c'); p(1, 1, 2, 2, Math.floor(now / 300) % 2 ? '#7fd8ff' : '#3a9fd8'); p(3.5, 3.5, 2, 1, '#bfe6c8')
    return
  }
  const kit = KITS[job.type]
  const at = kitAt(pet)
  // pops out of thin air, bottom-anchored
  const s = SCALE * easeOut(Math.min(1, pet.t / 180))
  if (s <= 0) return
  ctx.fillStyle = 'rgba(0,0,0,0.18)'
  ctx.beginPath(); ctx.ellipse(at.x, at.y, kit.w * s * 0.5, 2.5 * s, 0, 0, Math.PI * 2); ctx.fill()
  if (bgPhase === 'night') ctx.filter = 'brightness(0.75)'
  kit.draw(painter(at.x - (kit.w * s) / 2, at.y - kit.h * s, s), Math.min(1, pet.t / pet.until), now)
  ctx.filter = 'none'
}

function drawEffects () {
  for (const e of effects) {
    const fade = Math.max(0, 1 - e.t / e.life)
    ctx.globalAlpha = fade
    if (e.kind === 'spark') {
      ctx.fillStyle = e.color
      ctx.fillRect(Math.round(e.x), Math.round(e.y), SCALE, SCALE)
    } else if (e.kind === 'puff') {
      const r = SCALE * (1 + (e.t / e.life) * 1.5)
      ctx.fillStyle = 'rgba(245,245,240,0.9)'
      ctx.fillRect(Math.round(e.x - r), Math.round(e.y - r), Math.round(r * 2), Math.round(r * 2))
    } else if (e.kind === 'heart') {
      drawMap(painter(e.x - 2.5 * SCALE + Math.sin(e.t / 150) * 3, e.y - 2.5 * SCALE), HEART, HEART_PAL)
    } else drawLetter(e.x - 6, e.y + Math.sin(e.t / 120) * 2)
  }
  ctx.globalAlpha = 1
}

// ---------- berry tree: pick a berry, hand it to a Pokémon ----------
// Click a berry (or anywhere on the leaves) to pick one, then click a Pokémon — or drag it
// straight there. Let go anywhere else and it hops back onto its branch. Eaten ones regrow.
const BERRIES = {
  oran: { name: 'Oran Berry', body: '#4a7fd6', light: '#b5d0ff', dark: '#2c4f96' },
  pecha: { name: 'Pecha Berry', body: '#f29bbd', light: '#ffe0ec', dark: '#c4628a' },
  cheri: { name: 'Cheri Berry', body: '#e0483e', light: '#ffa79a', dark: '#9c2b25' },
  sitrus: { name: 'Sitrus Berry', body: '#f2cf3c', light: '#fff5bf', dark: '#b88f1e' }
}
const BERRY = ['...sl..', '..ooo..', '.obbbo.', 'obwbbbo', 'obbbbbo', 'obbbbdo', '.obddo.', '..ooo..']
const HEART = ['rr.rr', 'rwrrr', 'rrrrr', '.rrr.', '..r..']
const HEART_PAL = { r: '#ff5a7e', w: '#ffd0da' }
const TREE_W = 37, TREE_H = 44 // art px; the trunk's foot is bottom-centre
const CANOPY_H = 30 // art rows of leaves above the bare trunk
const tree = {
  x: 0, y: 0, // foot of the trunk, on the back edge of the field
  img: null, prev: null, // cached per time of day; prev fades out with the old sky
  shake: -1e4, // when a berry was last picked: the leaves rustle
  // ripe | held | gone (eaten, regrows `at`) | back (hopping home from bx, by since `born`)
  slots: [[8, 20], [28, 20], [18, 23], [12, 11], [24, 11]].map(([ax, ay]) => ({ ax, ay, state: 'ripe', type: null, at: 0, born: -1e4 }))
}
for (const s of tree.slots) s.type = randomBerry(s)
let held = null // the berry being carried: { slot, type, x, y, drag, moved }
let aim = null // the Pokémon a carried berry is hovering over

// a berry for `slot`: any kind, but never a third of one color on the tree
// (a berry in hand or hopping home still counts — it may end up back on its branch)
function randomBerry (slot) {
  const count = (type) => tree.slots.filter((s) => s !== slot && s.state !== 'gone' && s.type === type).length
  return pick(Object.keys(BERRIES).filter((type) => count(type) < 2))
}

function slotPos (s) {
  return { x: tree.x + (s.ax + 0.5 - TREE_W / 2) * SCALE, y: tree.y + (s.ay + 0.5 - TREE_H) * SCALE }
}

function drawBerry (x, y, type, s = SCALE) {
  const b = BERRIES[type]
  drawMap(painter(x - 3.5 * s, y - 4.5 * s, s), BERRY, { s: '#3b6b2a', l: '#79c454', o: INK, b: b.body, w: b.light, d: b.dark })
}

// a round little tree in pixel art: puffs of leaves lit from the top left, on a stubby trunk
function buildTree (phase) {
  const night = phase === 'night'
  const [lo, ld, lm, ll] = night ? ['#0e2418', '#1a3d29', '#245038', '#306447'] : ['#1d3f24', '#2e6b37', '#3f8a45', '#62b154']
  const [bo, bd, bl] = night ? ['#170f08', '#2c1d11', '#41301c'] : ['#3a2414', '#5c3b20', '#87592e']
  const px = new Array(TREE_W * TREE_H).fill(null)
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < TREE_W && y < TREE_H) px[y * TREE_W + x] = c }
  const mid = (TREE_W - 1) / 2
  for (let y = 22; y < TREE_H - 1; y++) {
    const half = y >= TREE_H - 3 ? 3 : 2 // roots flare out
    for (let x = mid - half; x <= mid + half; x++) set(x, y, x < mid && y > CANOPY_H ? bl : bd)
  }
  for (const [cx, cy, rad] of [[9, 21, 7.5], [28, 21, 7.5], [12.5, 10.5, 8], [24.5, 10.5, 8], [18.5, 17.5, 11]]) {
    for (let y = Math.floor(cy - rad); y < cy + rad; y++) {
      for (let x = Math.floor(cx - rad); x < cx + rad; x++) {
        const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy)
        if (d > rad) continue
        const lit = Math.hypot(x + 0.5 - (cx - rad * 0.35), y + 0.5 - (cy - rad * 0.4)) < rad * 0.42
        const shade = d > rad - 2.5 && x + 0.5 - cx + y + 0.5 - cy > rad * 0.3
        set(x, y, lit ? ll : shade ? ld : lm)
      }
    }
  }
  const r = seeded(5)
  for (let i = 0; i < 46; i++) { // leaf specks
    const x = Math.floor(r() * TREE_W), y = Math.floor(r() * CANOPY_H)
    if (px[y * TREE_W + x] === lm) set(x, y, r() < 0.6 ? ld : ll)
  }
  // 1px outline around the whole shape
  const shape = px.slice()
  const at = (x, y) => (x >= 0 && y >= 0 && x < TREE_W && y < TREE_H ? shape[y * TREE_W + x] : null)
  for (let y = 0; y < TREE_H; y++) {
    for (let x = 0; x < TREE_W; x++) {
      const n = !shape[y * TREE_W + x] && (at(x - 1, y) || at(x + 1, y) || at(x, y - 1) || at(x, y + 1))
      if (n) set(x, y, n === bl || n === bd ? bo : lo)
    }
  }
  const off = document.createElement('canvas')
  off.width = TREE_W
  off.height = TREE_H
  const g = off.getContext('2d')
  px.forEach((c, i) => { if (c) { g.fillStyle = c; g.fillRect(i % TREE_W, Math.floor(i / TREE_W), 1, 1) } })
  return off
}

function drawTree (now, fade) {
  const ox = tree.x - (TREE_W / 2) * SCALE, oy = tree.y - TREE_H * SCALE
  ctx.fillStyle = 'rgba(0,0,0,0.2)'
  ctx.beginPath()
  ctx.ellipse(tree.x, tree.y - 2, 13 * SCALE, 3 * SCALE, 0, 0, Math.PI * 2)
  ctx.fill()
  // the leaves rustle for a moment after a pick
  const k = (now - tree.shake) / 360
  const dx = k < 1 && !reduceMotion ? Math.round(Math.sin(k * Math.PI * 5) * 2 * (1 - k)) : 0
  const blit = (img, alpha) => {
    ctx.globalAlpha = alpha
    ctx.drawImage(img, 0, 0, TREE_W, CANOPY_H, ox + dx, oy, TREE_W * SCALE, CANOPY_H * SCALE)
    ctx.drawImage(img, 0, CANOPY_H, TREE_W, TREE_H - CANOPY_H, ox, oy + CANOPY_H * SCALE, TREE_W * SCALE, (TREE_H - CANOPY_H) * SCALE)
    ctx.globalAlpha = 1
  }
  if (fade < 1 && tree.prev) blit(tree.prev, 1)
  else tree.prev = null
  blit(tree.img, fade)
  if (bgPhase === 'night') ctx.filter = 'brightness(0.75)'
  for (const s of tree.slots) {
    const at = slotPos(s)
    if (s.state === 'ripe') {
      const grow = easeOut(Math.min(1, (now - s.born) / 400)) // regrown ones pop in
      if (grow > 0) drawBerry(at.x + dx, at.y, s.type, SCALE * grow)
    } else if (s.state === 'back') {
      const t = easeOut(Math.min(1, (now - s.born) / 300))
      drawBerry(lerp(s.bx, at.x, t), lerp(s.by, at.y, t) - Math.sin(t * Math.PI) * 18, s.type)
    }
  }
  ctx.filter = 'none'
}

function updateTree (now) {
  for (const s of tree.slots) {
    if (s.state === 'back' && now - s.born >= 300) {
      s.state = 'ripe'
      s.born = -1e4
    } else if (s.state === 'gone' && now >= s.at) {
      s.state = 'ripe'
      s.type = randomBerry(s)
      s.born = now
    }
  }
}

// the ripe berry nearest to (x, y), within `reach`
function berryAt (x, y, reach) {
  let best = null
  for (const s of tree.slots) {
    if (s.state !== 'ripe') continue
    const at = slotPos(s), d = Math.hypot(at.x - x, at.y - y)
    if (d <= reach) { reach = d; best = s }
  }
  return best
}

function onCanopy (x, y) {
  return Math.abs(x - tree.x) <= (TREE_W / 2) * SCALE && y >= tree.y - TREE_H * SCALE && y <= tree.y - (TREE_H - CANOPY_H) * SCALE
}

function pickBerry (slot, x, y) {
  slot.state = 'held'
  held = { slot, type: slot.type, x, y, drag: true, moved: 0 }
  tree.shake = performance.now()
  const at = slotPos(slot)
  for (let i = 0; i < 3; i++) { // a few leaves come loose
    effects.push({
      kind: 'spark', x: at.x + rand(-12, 12), y: at.y + rand(-8, 4), vx: rand(-14, 14), vy: rand(16, 30),
      t: 0, life: rand(700, 1100), color: bgPhase === 'night' ? '#245038' : pick(['#3f8a45', '#62b154'])
    })
  }
}

// let go of the carried berry: a Pokémon under it eats it, anywhere else it hops back to its branch
function dropBerry (x, y) {
  const { slot, type } = held
  held = null
  const pet = petAt(x, y)
  if (pet && feed(pet, type)) {
    slot.state = 'gone'
    slot.at = performance.now() + rand(9000, 16000)
  } else {
    slot.state = 'back'
    slot.born = performance.now()
    slot.bx = x
    slot.by = y
  }
}

function feed (pet, type) {
  if (pet.snack) return false // one at a time
  if (pet.state === 'sleep') pet.setState('idle') // food wakes anyone up, Snorlax included
  const eat = pet.mon.anims.eat
  pet.snack = { type, t: 0, dur: eat ? (eat.total * 1000 / 60) * 4 : 1800 }
  return true
}

// three bites with crumbs flying, then a happy hop (a worker just gets back to it)
function updateSnack (pet, dt) {
  const s = pet.snack
  const bite = Math.floor((s.t / s.dur) * 3)
  s.t += dt
  if (Math.floor((s.t / s.dur) * 3) > bite) {
    const m = mouthAt(pet), b = BERRIES[s.type]
    for (let i = 0; i < 4; i++) {
      effects.push({ kind: 'spark', x: m.x + rand(-4, 4), y: m.y, vx: rand(-45, 45), vy: rand(-60, -20), g: 200, t: 0, life: rand(300, 450), color: pick([b.body, b.light]) })
    }
  }
  if (s.t < s.dur) return
  pet.snack = null
  pet.say = pick(['Nom nom!', 'Yum!', `${BERRIES[s.type].name} ♥`])
  pet.bubble = 2000
  hearts(pet, 2)
  if (!pet.job) pet.setState(reduceMotion ? 'idle' : 'hop')
}

// where a snack is held: about a third of the way from the feet up to the top of the head
function mouthAt (pet) {
  return { x: pet.x, y: pet.y - (pet.mon.feet - pet.anim().head) * SCALE * 0.32 }
}

function drawSnack (pet) {
  const s = pet.snack, m = mouthAt(pet)
  const left = 3 - Math.min(3, Math.floor((s.t / s.dur) * 3)) // bites left
  if (!left) return
  if (bgPhase === 'night') ctx.filter = 'brightness(0.75)'
  drawBerry(m.x, m.y, s.type, SCALE * (0.4 + 0.2 * left))
  ctx.filter = 'none'
}

function hearts (pet, n) {
  const top = pet.y - (pet.mon.feet - pet.anim().head) * SCALE
  for (let i = 0; i < n; i++) {
    effects.push({ kind: 'heart', x: pet.x + rand(-12, 12), y: top - rand(2, 10), vx: rand(-8, 8), vy: rand(-34, -22), t: 0, life: rand(900, 1200) })
  }
}

// ---------- petting: press on a Pokémon and rub ----------
// A press that starts to rub turns into petting: a hand pats the head in time with the rubbing
// ("pet pet"), the Pokémon squashes under it and hearts float up. A press that doesn't move
// is still a plain click (say hi).
const HAND = [
  '...oooooooo..',
  '...obbbbbbo..',
  '...oBBBBBBo..',
  '..oossssssoo.',
  '.osssssssssso',
  'osssossssssso',
  'osssossssssso',
  '.ooosssssssso',
  '...oshshshsso',
  '...oshshshso.',
  '...oshshshso.',
  '....ooooooo..'
]
const HAND_PAL = { o: INK, b: '#5b8fd6', B: '#3d6db0', s: '#fbe3c8', h: '#e8bf98' }
let press = null // pointer down on a Pokémon: { pet, x0, y0, x, y, travel, rubbing, phase, pats }

const isPetted = (p) => !!press && press.rubbing && press.pet === p
// how far the hand is pressing down: 0 at rest, 1 as a pat lands
const squashOf = (p) => (isPetted(p) && !reduceMotion ? Math.sin((press.phase % 1) * Math.PI) : 0)

function startPetting () {
  press.rubbing = true
  const p = press.pet
  if (!p.job && !p.snack && p.state !== 'sleep') { // stops and turns to you
    p.setState('idle')
    p.facingFront = true
  }
}

function endPetting () {
  const p = press.pet
  if (!pets.includes(p) || !press.pats) return
  p.say = p.state === 'sleep' ? 'zzz… ♥' : pick(['♥', 'Hehe~ ♥', '♥ ♥'])
  p.bubble = 1600
  if (!p.job && !p.snack && p.state !== 'sleep') p.setState(reduceMotion ? 'idle' : 'hop')
}

function updatePetting (dt) {
  if (!press?.rubbing) return
  if (!pets.includes(press.pet)) { press = null; return }
  // every ~36px of rubbing queues a pat; the hand always finishes one, then rests
  const before = press.phase
  press.phase = Math.min(Math.ceil(press.travel / 36), press.phase + (dt / 1000) * 4.5)
  if (Math.round(press.phase) > Math.round(before)) { // a pat lands
    press.pats++
    hearts(press.pet, 1)
  }
}

function drawPetting () {
  if (!press?.rubbing) return
  const p = press.pet, sq = squashOf(p)
  const head = p.y - (p.mon.feet - p.anim().head) * SCALE * (1 - sq * 0.14)
  const span = Math.min(p.rect().w * 0.2, 14) // the hand slides across the head with the rubbing
  const hx = Math.min(Math.max(press.x, p.x - span), p.x + span)
  // fingertips on the head as a pat lands, lifted a little in between
  drawMap(painter(hx - 6.5 * SCALE, head - (10 + (1 - sq) * 2) * SCALE), HAND, HAND_PAL)
}

// ---------- scenery (cached, redrawn on resize or when the time of day changes) ----------
const SKY = {
  day: ['#36567a', '#7fa7c4'],
  dusk: ['#2d2a4f', '#c9805e'],
  night: ['#0b1222', '#1d2945']
}

function seeded (seed) {
  return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646 }
}

function buildBackground (phase) {
  const off = document.createElement('canvas')
  off.width = Math.max(1, Math.round(W * dpr))
  off.height = Math.max(1, Math.round(H * dpr))
  const g = off.getContext('2d')
  g.scale(dpr, dpr)
  const r = seeded(7)
  const [top, bottom] = SKY[phase]
  const sky = g.createLinearGradient(0, 0, 0, groundTop)
  sky.addColorStop(0, top)
  sky.addColorStop(1, bottom)
  g.fillStyle = sky
  g.fillRect(0, 0, W, groundTop + 2)

  if (phase === 'night') {
    for (let i = 0; i < Math.round(W * groundTop / 900); i++) {
      g.fillStyle = `rgba(255,255,240,${0.35 + r() * 0.5})`
      const s = r() < 0.15 ? 2 : 1
      g.fillRect(Math.round(r() * W), Math.round(r() * (groundTop - 30)), s, s)
    }
    g.fillStyle = '#f3ecd2'
    g.beginPath(); g.arc(W - 42, 34, 12, 0, Math.PI * 2); g.fill()
    g.fillStyle = top
    g.beginPath(); g.arc(W - 36, 30, 11, 0, Math.PI * 2); g.fill()
  } else {
    g.fillStyle = phase === 'day' ? 'rgba(255,240,180,0.9)' : 'rgba(255,190,120,0.9)'
    g.beginPath(); g.arc(W - 46, phase === 'day' ? 36 : groundTop - 18, 13, 0, Math.PI * 2); g.fill()
  }

  // far hills
  const hill = (color, base, amp, freq, shift) => {
    g.fillStyle = color
    g.beginPath()
    g.moveTo(0, groundTop + 2)
    for (let x = 0; x <= W; x += 4) g.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin(x / freq + shift)))
    g.lineTo(W, groundTop + 2)
    g.closePath()
    g.fill()
  }
  const dark = phase === 'night'
  hill(dark ? '#16302a' : '#3e6e4a', groundTop + 2, 26, 46, 1.3)
  hill(dark ? '#1b3a2b' : '#4d8a4f', groundTop + 2, 14, 31, 4.1)

  // grass field
  const grass = g.createLinearGradient(0, groundTop, 0, H)
  grass.addColorStop(0, dark ? '#24472e' : '#5d9e4f')
  grass.addColorStop(1, dark ? '#152a1c' : '#3e7a3c')
  g.fillStyle = grass
  g.fillRect(0, groundTop, W, H - groundTop)
  g.fillStyle = dark ? '#2f5a3a' : '#79b863'
  g.fillRect(0, groundTop, W, 3)

  // tufts + a few flowers
  for (let i = 0; i < Math.round(W * (H - groundTop) / 260); i++) {
    const x = Math.round(r() * W), y = Math.round(groundTop + 8 + r() * (H - groundTop - 10))
    g.fillStyle = dark ? 'rgba(80,140,90,0.45)' : 'rgba(40,90,40,0.45)'
    g.fillRect(x, y, 2, 4); g.fillRect(x + 3, y + 1, 2, 3); g.fillRect(x - 3, y + 2, 2, 2)
    if (r() < 0.12) {
      g.fillStyle = pick(dark ? ['#8f86b8', '#b5a77a'] : ['#f7d02c', '#f08c9c', '#f3ecd2'])
      g.fillRect(x + 7, y - 2, 3, 3)
    }
  }
  return off
}

const clouds = Array.from({ length: 3 }, (_, i) => ({ x: Math.random() * 400, y: 18 + i * 22, s: rand(4, 9), w: rand(36, 60) }))
function drawClouds (dt) {
  if (bgPhase === 'night') return
  ctx.fillStyle = bgPhase === 'day' ? 'rgba(255,255,255,0.55)' : 'rgba(255,220,200,0.35)'
  for (const c of clouds) {
    if (!reduceMotion) c.x += c.s * dt / 1000
    if (c.x > W + c.w) c.x = -c.w
    const y = Math.min(c.y, groundTop - 40)
    ctx.fillRect(Math.round(c.x), y, c.w, 6)
    ctx.fillRect(Math.round(c.x + c.w * 0.2), y - 5, c.w * 0.45, 5)
  }
}

// ---------- layout + loop ----------
function resize () {
  dpr = window.devicePixelRatio || 1
  readTokens()
  W = canvas.clientWidth
  H = canvas.clientHeight
  canvas.width = Math.round(W * dpr)
  canvas.height = Math.round(H * dpr)
  groundTop = Math.round(H - Math.max(110, H * 0.45))
  tree.x = Math.round(Math.min(Math.max(46, W * 0.17), 110))
  tree.y = groundTop + 12
  bgPhase = phaseNow()
  bg = buildBackground(bgPhase)
  tree.img = buildTree(bgPhase)
  prevBg = tree.prev = null // a resize redraws the sky at the new size; nothing to fade from
  for (const p of pets) {
    p.x = Math.min(Math.max(p.x, 24), Math.max(24, W - 24))
    p.y = Math.min(Math.max(p.y, groundTop + 30), H - 12)
  }
}

function spawn (key) {
  if (!mons[key]) return
  if (pets.length >= MAX_PETS) pets.shift()
  const p = new Pet(mons[key], rand(30, Math.max(31, W - 30)), rand(groundTop + 34, H - 14))
  pets.push(p)
  updateCount()
  return p
}

function updateCount () {
  document.getElementById('count').textContent = `· ${pets.length}`
}

function defaultParty () {
  pets = []
  const others = Object.keys(mons).filter((k) => k !== 'pikachu').sort(() => Math.random() - 0.5)
  for (const key of ['pikachu', ...others.slice(0, 3)]) spawn(key)
}

let last = performance.now(), acc = 0
function loop (now) {
  requestAnimationFrame(loop)
  if (document.hidden) { last = now; return }
  const dt = Math.min(100, now - last)
  acc += dt
  last = now
  if (acc < 1000 / FPS) return
  const step = acc
  acc = 0
  if (phaseNow() !== bgPhase) {
    prevBg = bg
    tree.prev = tree.img
    fadeStart = now
    bgPhase = phaseNow()
    bg = buildBackground(bgPhase)
    tree.img = buildTree(bgPhase)
  }
  director(now)
  updateTree(now)
  updatePetting(step)
  aim = held ? petAt(held.x, held.y) || null : null
  for (const p of pets) p.update(step)
  updateWork(now, step)
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.clearRect(0, 0, canvas.width, canvas.height)
  const fade = prevBg ? Math.min(1, (now - fadeStart) / SKY_FADE_MS) : 1
  if (fade < 1) ctx.drawImage(prevBg, 0, 0)
  else prevBg = null
  ctx.globalAlpha = fade
  if (bg) ctx.drawImage(bg, 0, 0)
  ctx.globalAlpha = 1
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.imageSmoothingEnabled = false
  drawClouds(step)
  drawTree(now, fade)
  for (const p of [...pets].sort((a, b) => a.y - b.y)) p.draw(now)
  drawEffects()
  drawPetting()
  if (held) drawBerry(held.x, held.y, held.type)
}

// ---------- pointer: say hi, pet, pick and feed ----------
function pointerAt (e) {
  const r = canvas.getBoundingClientRect()
  return { x: e.clientX - r.left, y: e.clientY - r.top }
}

function petAt (x, y) {
  return [...pets].sort((a, b) => b.y - a.y).find((p) => {
    const b = p.rect()
    return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h
  })
}

// what's under the pointer: a berry first (they're small), then a Pokémon, then the rest of the leaves
function targetAt (x, y) {
  const slot = berryAt(x, y, 10)
  if (slot) return { slot }
  const pet = petAt(x, y)
  if (pet) return { pet }
  return { slot: onCanopy(x, y) ? berryAt(x, y, Infinity) : null }
}

function updateCursor (x, y) {
  const t = targetAt(x, y)
  canvas.style.cursor = press?.rubbing ? 'none' : held ? 'grabbing' : t.slot ? 'grab' : t.pet ? 'pointer' : 'default'
}

function greet (pet) {
  pet.bubble = 1800
  if (pet.job) { // don't interrupt a worker — just say what they're up to
    pet.say = `${pet.mon.name} · ${pet.job.label}`
    return
  }
  pet.setState(reduceMotion ? 'idle' : 'hop')
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || press) return
  const { x, y } = pointerAt(e)
  if (held) return dropBerry(x, y) // the second click of click-to-carry
  const t = targetAt(x, y)
  if (!t.slot && !t.pet) return
  canvas.setPointerCapture(e.pointerId)
  if (t.slot) pickBerry(t.slot, x, y)
  else press = { pet: t.pet, x0: x, y0: y, x, y, travel: 0, rubbing: false, phase: 0, pats: 0 }
  updateCursor(x, y)
})
canvas.addEventListener('pointermove', (e) => {
  const { x, y } = pointerAt(e)
  if (held) {
    held.moved += Math.hypot(x - held.x, y - held.y)
    held.x = x
    held.y = y
  }
  if (press) {
    press.travel += Math.hypot(x - press.x, y - press.y)
    press.x = x
    press.y = y
    if (!press.rubbing && Math.hypot(x - press.x0, y - press.y0) > 6) startPetting()
  }
  updateCursor(x, y)
})
canvas.addEventListener('pointerup', (e) => {
  const { x, y } = pointerAt(e)
  if (held?.drag) {
    held.drag = false
    if (held.moved > 12) dropBerry(x, y) // dragged somewhere; a plain click keeps carrying it
  }
  if (press) {
    if (press.rubbing) endPetting()
    else greet(press.pet)
    press = null
  }
  updateCursor(x, y)
})
canvas.addEventListener('pointercancel', () => {
  if (press?.rubbing) endPetting()
  press = null
})

async function init () {
  const select = document.getElementById('pick')
  for (const [key, m] of Object.entries(DATA.mons)) {
    const anims = {}
    for (const [name, a] of Object.entries(m.anims)) {
      const img = await loadImage(a.src)
      anims[name] = {
        img, fw: a.fw, fh: a.fh, dur: a.dur,
        rows: Math.max(1, Math.round(img.height / a.fh)),
        total: a.dur.reduce((s, d) => s + d, 0)
      }
      anims[name].head = headOffset(anims[name])
    }
    mons[key] = { key, name: m.name, anims, feet: feetOffset(anims.walk), shadow: m.shadow, phase: Math.random() * 5000 }
    const opt = document.createElement('option')
    opt.value = key
    opt.textContent = m.name
    select.appendChild(opt)
  }
  select.value = 'pikachu'
  resize()
  defaultParty()
  document.getElementById('add').addEventListener('click', () => spawn(select.value))
  document.getElementById('reset').addEventListener('click', defaultParty)
  renderSkyButton()
  document.getElementById('sky').addEventListener('click', () => {
    skyMode = SKY_MODES[(SKY_MODES.indexOf(skyMode) + 1) % SKY_MODES.length]
    renderSkyButton()
    applySky()
  })
  new ResizeObserver(resize).observe(canvas)
  requestAnimationFrame(loop)
}

init()
</script>
